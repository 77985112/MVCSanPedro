<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Logo PRI-COM - Parroquia San Pedro de Sacaba">
  <defs>
    <clipPath id="priComCirculo">
      <circle cx="200" cy="200" r="193"/>
    </clipPath>
    <radialGradient id="priComRayo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="priComCopa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d774"/>
      <stop offset="45%" stop-color="#d9a520"/>
      <stop offset="100%" stop-color="#a97408"/>
    </linearGradient>
    <linearGradient id="priComPan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2b25a"/>
      <stop offset="100%" stop-color="#c97716"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#priComCirculo)">
    <circle cx="200" cy="200" r="193" fill="#ffffff"/>

    <!-- Texto superior -->
    <text x="200" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6b7280" letter-spacing="1">PARROQUIA</text>
    <text x="200" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#6b7280" letter-spacing=".5">SAN PEDRO DE SACABA</text>

    <!-- Templo -->
    <g stroke="#c4b89e" stroke-width="2">
      <rect x="135" y="150" width="130" height="150" fill="#f4edda"/>
      <polygon points="135,150 200,118 265,150" fill="#efe5cd"/>
      <rect x="186" y="130" width="28" height="26" fill="#f4edda"/>
      <polygon points="186,130 200,118 214,130" fill="#efe5cd"/>

      <rect x="92" y="145" width="40" height="155" fill="#f4edda"/>
      <polygon points="92,145 112,110 132,145" fill="#efe5cd"/>
      <rect x="268" y="145" width="40" height="155" fill="#f4edda"/>
      <polygon points="268,145 288,110 308,145" fill="#efe5cd"/>

      <rect x="104" y="170" width="16" height="28" rx="8" fill="#8a8170"/>
      <rect x="280" y="170" width="16" height="28" rx="8" fill="#8a8170"/>
      <rect x="188" y="176" width="24" height="28" rx="12" fill="#8a8170"/>
    </g>

    <!-- Cruces -->
    <g stroke="#4b5563" stroke-width="3" stroke-linecap="round">
      <line x1="112" y1="98" x2="112" y2="110"/>
      <line x1="107" y1="103" x2="117" y2="103"/>
      <line x1="288" y1="98" x2="288" y2="110"/>
      <line x1="283" y1="103" x2="293" y2="103"/>
      <line x1="200" y1="110" x2="200" y2="120"/>
      <line x1="195" y1="115" x2="205" y2="115"/>
    </g>

    <!-- Trigo izquierdo -->
    <g stroke="#c9a227" stroke-width="4" fill="none">
      <path d="M76 316 C68 272 72 236 86 208"/>
      <path d="M90 320 C84 278 88 242 102 214"/>
    </g>
    <g fill="#e3bb3c">
      <ellipse cx="80" cy="222" rx="6" ry="11" transform="rotate(-20 80 222)"/>
      <ellipse cx="78" cy="242" rx="6" ry="11" transform="rotate(-18 78 242)"/>
      <ellipse cx="79" cy="262" rx="6" ry="11" transform="rotate(-15 79 262)"/>
      <ellipse cx="96" cy="228" rx="6" ry="11" transform="rotate(-16 96 228)"/>
      <ellipse cx="94" cy="248" rx="6" ry="11" transform="rotate(-14 94 248)"/>
      <ellipse cx="95" cy="268" rx="6" ry="11" transform="rotate(-12 95 268)"/>
    </g>

    <!-- Vid derecha -->
    <g stroke="#2f7d32" stroke-width="4" fill="none">
      <path d="M306 200 C316 224 318 250 312 276"/>
      <path d="M300 222 C312 216 322 218 330 226"/>
    </g>
    <g fill="#2f7d32">
      <ellipse cx="316" cy="214" rx="10" ry="6" transform="rotate(30 316 214)"/>
      <ellipse cx="302" cy="238" rx="10" ry="6" transform="rotate(-20 302 238)"/>
      <ellipse cx="326" cy="246" rx="10" ry="6" transform="rotate(25 326 246)"/>
    </g>
    <g fill="#7b2d78">
      <circle cx="314" cy="230" r="5"/>
      <circle cx="323" cy="234" r="5"/>
      <circle cx="308" cy="242" r="5"/>
      <circle cx="318" cy="246" r="5"/>
      <circle cx="327" cy="250" r="5"/>
    </g>

    <!-- Rayos -->
    <circle cx="200" cy="310" r="74" fill="url(#priComRayo)"/>
    <g stroke="#f0c419" stroke-width="3" opacity=".85">
      <line x1="200" y1="286" x2="200" y2="262"/>
      <line x1="166" y1="292" x2="150" y2="276"/>
      <line x1="234" y1="292" x2="250" y2="276"/>
      <line x1="148" y1="322" x2="128" y2="314"/>
      <line x1="252" y1="322" x2="272" y2="314"/>
      <line x1="158" y1="350" x2="140" y2="360"/>
      <line x1="242" y1="350" x2="260" y2="360"/>
    </g>

    <!-- Banda verde -->
    <rect x="52" y="208" width="296" height="68" rx="5" fill="#1e8a3c"/>
    <rect x="52" y="208" width="296" height="7" rx="3" fill="#13632a"/>
    <text x="200" y="258" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="43" font-weight="900" fill="#ffffff" letter-spacing="1">PRI-COM</text>

    <!-- Suelo -->
    <path d="M4 356 C100 338 300 338 396 356 L396 397 L4 397 Z" fill="#1b1b1b"/>

    <!-- Niño izquierdo -->
    <g>
      <circle cx="78" cy="250" r="14" fill="#5b3a29"/>
      <path d="M64 266 C59 288 61 310 65 332 L94 332 C98 308 96 284 90 266 Z" fill="#8a4b2a"/>
      <path d="M67 332 L65 354 L75 354 L77 332 Z" fill="#2f3a4a"/>
      <path d="M87 332 L89 354 L99 354 L95 332 Z" fill="#2f3a4a"/>
      <path d="M65 280 L54 298 L60 303 L71 286 Z" fill="#8a4b2a"/>
      <rect x="89" y="270" width="12" height="32" rx="4" fill="#6b3a20"/>
    </g>

    <!-- Niño derecho -->
    <g>
      <ellipse cx="322" cy="258" rx="24" ry="7" fill="#e7c25a"/>
      <circle cx="322" cy="268" r="14" fill="#d9a86c"/>
      <path d="M303 288 C299 308 301 326 307 342 L339 342 C345 324 343 304 335 288 Z" fill="#c0392b"/>
      <path d="M307 342 L305 358 L317 358 L319 342 Z" fill="#2f4a7a"/>
      <path d="M329 342 L331 358 L343 358 L339 342 Z" fill="#2f4a7a"/>
      <path d="M335 296 L351 312 L345 320 L329 306 Z" fill="#c0392b"/>
      <rect x="347" y="328" width="18" height="16" rx="3" fill="#7fb3d5"/>
    </g>

    <!-- Hostia -->
    <circle cx="200" cy="300" r="27" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="200" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#9ca3af">JHS</text>

    <!-- Cáliz -->
    <path d="M174 322 C174 340 184 349 200 349 C216 349 226 340 226 322 Z" fill="url(#priComCopa)" stroke="#8a5f05" stroke-width="2"/>
    <rect x="194" y="349" width="12" height="18" fill="#c9971a"/>
    <ellipse cx="200" cy="369" rx="25" ry="6" fill="#c9971a" stroke="#8a5f05" stroke-width="2"/>

    <!-- Uvas -->
    <g fill="#9b1b8f" stroke="#6d0f64" stroke-width="1">
      <circle cx="146" cy="340" r="10"/>
      <circle cx="162" cy="336" r="10"/>
      <circle cx="178" cy="342" r="10"/>
      <circle cx="152" cy="356" r="10"/>
      <circle cx="168" cy="354" r="10"/>
      <circle cx="184" cy="358" r="10"/>
      <circle cx="160" cy="370" r="10"/>
      <circle cx="176" cy="370" r="10"/>
    </g>
    <path d="M142 324 C150 316 160 316 168 322 C160 328 150 330 142 324 Z" fill="#3a8a3a"/>

    <!-- Pan -->
    <ellipse cx="256" cy="360" rx="37" ry="19" fill="url(#priComPan)" stroke="#9a5a0e" stroke-width="2"/>
    <path d="M233 350 C245 344 268 344 279 350" fill="none" stroke="#f6d29a" stroke-width="3"/>
    <path d="M239 360 C249 354 266 354 275 360" fill="none" stroke="#f6d29a" stroke-width="3"/>
  </g>

  <circle cx="200" cy="200" r="193" fill="none" stroke="#111111" stroke-width="5"/>
</svg>
